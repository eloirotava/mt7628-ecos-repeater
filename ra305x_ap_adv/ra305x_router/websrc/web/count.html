<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A1000 WiFi</title>
<link rel="stylesheet" href="css/count.css">
</head>

<body>
<div class="container">
    <span id="section1" style="display:block">
    <div class="page_header">
    <h1>Restarting. Please wait...</h1>
    </div>
    <div class="page_main">
        <div id="wifi_logo">
            <img src="images/hengloading.gif" alt="Please wait" width="250" height="185">
            <span></span>
        </div>
        <div class="btn_start">
        <input type="button" value="25" id="btn_count">
        <span></span>
        </div>
    </div>
    </span>

    <span id="section2" style="display:none">
    <div class="page_header">
    <h1>Restart complete. Reconnect to the configured Wi-Fi network.</h1>
    </div>
    <div class="page_main">
        <div id="wifi_logo">
            <img src="images/setSucess.png" alt="Please wait">
            <span></span>
        </div>
        <div class="btn_start">
        <input type="button" value="Back to home" id="btn_sucess" onClick="location.href='index.html'">
        <span></span>
        </div>
    </div>
    </span>
    <script language="javascript" type="text/javascript">

        var second = document.getElementById('btn_count').value;
        setInterval("redirect()", 1000);
        function redirect(){
            if (second < 0){
                document.title = "Restart complete. Reconnect to your Wi-Fi network.";
                document.getElementById("section1").style.display = "none";
                document.getElementById("section2").style.display = "block";

            } else{
                document.getElementById('btn_count').value = second--;
            }
    }
</script>
</div>
</body>
</html>
